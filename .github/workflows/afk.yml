name: Minecraft AFK Bot
on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install and Run MCC
        run: |
          # Устанавливаем конкретную версию инструмента напрямую из NuGet
          dotnet tool install -g MC-Console-Client --version 1.21.0-243
          
          # Добавляем путь к инструментам в систему
          export PATH="$PATH:/home/runner/.dotnet/tools"
          
          # Запускаем под именем 'mcc' (или MinecraftClient)
          # Если не сработает mcc, скрипт попробует другое имя автоматически
          MinecraftClient "${{ secrets.MC_LOGIN }}" Microsoft "${{ secrets.SERVER_IP }}" || \
          mcc "${{ secrets.MC_LOGIN }}" Microsoft "${{ secrets.SERVER_IP }}"
