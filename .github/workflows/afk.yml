name: Minecraft AFK Bot
on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    container:
      image: mcrelease/mcc:latest # Используем официальный контейнер
    steps:
      - name: Run Minecraft Client
        # В контейнере программа уже установлена и называется 'mcc'
        run: mcc "${{ secrets.MC_LOGIN }}" Microsoft "${{ secrets.SERVER_IP }}"
