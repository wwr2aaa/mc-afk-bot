name: Minecraft AFK Bot
on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Download MCC
        run: |
          # Скачиваем проверенную версию 1.20.1, она точно доступна
          curl -L -o mcc https://github.com/MC-Console-Client/Minecraft-Console-Client/releases/download/1.20.1/MinecraftClient-Linux-x64
          chmod +x mcc

      - name: Run Minecraft Client
        # Запускаем файл
        run: ./mcc "${{ secrets.MC_LOGIN }}" Microsoft "${{ secrets.SERVER_IP }}"
