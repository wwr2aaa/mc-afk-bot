name: Minecraft AFK Bot
on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Download and Unpack MCC
        run: |
          # 1. Скачиваем архив (универсальная версия)
          wget https://github.com/MC-Console-Client/Minecraft-Console-Client/releases/download/1.21/MinecraftClient-Linux-zlib-x64
          
          # 2. Даем права на запуск
          chmod +x MinecraftClient-Linux-zlib-x64

      - name: Run Minecraft Client
        # 3. Запускаем напрямую
        run: ./MinecraftClient-Linux-zlib-x64 "${{ secrets.MC_LOGIN }}" Microsoft "${{ secrets.SERVER_IP }}"
