name: Minecraft AFK Bot

concurrency:
  group: mc-bot-session
  cancel-in-progress: true

on:
  workflow_dispatch:
  schedule:
    # Запуск каждые 5 часов (00:00, 05:00, 10:00 и т.д.)
    - cron: '0 */5 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Mineflayer
        run: npm install mineflayer prismarine-auth

      # Загружаем сохраненный логин из прошлых запусков
      - name: Download Session
        uses: dawidd6/action-download-artifact@v3
        with:
          name: mcc-session
          path: ./nmp-cache
          if_no_artifact_found: warn

      - name: Create Bot Script
        run: |
          cat << EOF > bot.js
          const mineflayer = require('mineflayer')
          const bot = mineflayer.createBot({
            host: process.env.SERVER_IP,
            auth: 'microsoft',
            profilesFolder: './nmp-cache'
          })

          bot.on('login', () => console.log('Успех! Бот залогинился.'))
          bot.on('spawn', () => console.log('Персонаж в игре. Жду следующего цикла.'))
          
          bot.on('microsoftAuth', (info) => {
            console.log('------------------------------------------')
            console.log('ПЕРЕЙДИ СЮДА:', info.user_code_url)
            console.log('ВВЕДИ ЭТОТ КОД:', info.user_code)
            console.log('------------------------------------------')
          })

          // Чтобы процесс не закрывался сам по себе
          bot.on('error', (err) => console.log('Ошибка бота:', err))
          bot.on('kicked', (reason) => console.log('Бот кикнут:', reason))
          EOF

      - name: Run Bot
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: node bot.js

      # Сохраняем сессию в артефакты, чтобы в следующий раз зайти без кода
      - name: Save Session
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcc-session
          path: ./nmp-cache
          retention-days: 1
