name: Minecraft AFK Bot
on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install MCC
        run: |
          dotnet tool install -g MinecraftConsoleClient
          echo "/home/runner/.dotnet/tools" >> $GITHUB_PATH

      - name: Run Minecraft Client
        run: MinecraftClient "${{ secrets.MC_LOGIN }}" Microsoft "${{ secrets.SERVER_IP }}"
